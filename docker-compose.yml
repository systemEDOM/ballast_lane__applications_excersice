name: ballast-lane-tasks

services:
  api:
    build:
      context: ./api
      dockerfile: src/Api/Dockerfile
    image: ballast-lane/api:local
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Data Source=/data/app.db
      Jwt__Key: ${JWT_KEY:-local-dev-key-change-me-0123456789abcdef}
      Jwt__Issuer: ballast-lane
      Jwt__Audience: ballast-lane-client
    volumes:
      - appdata:/data
    ports:
      - "5080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ./web
    image: ballast-lane/web:local
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  tests:
    profiles: ["tests"]
    build:
      context: ./api
      dockerfile: src/Api/Dockerfile
      target: test
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    command: ["dotnet", "test", "BallastLane.sln", "-c", "Release", "--nologo", "--no-build"]

volumes:
  appdata:
